# Added to both 443 server blocks for waterfirst.pro (old laptop host nginx).
# Static build is served from ~/web/circuit/ by the existing "location /".
location /circuit/api/ {
    limit_req zone=wf_api burst=10 nodelay;
    proxy_pass http://100.69.9.76:8767/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    client_max_body_size 64k;
}
